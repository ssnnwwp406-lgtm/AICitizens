
# =====================================
# AICitizens Configuration
# =====================================

# Citizens Settings
citizens:
  max-count: 50

  spawn:
    enabled: true
    remove-on-disable: true

  appearance:
    type: VILLAGER
    invulnerable: true
    collidable: false
    persistent: true
    ai-enabled: false
    custom-name-visible: false

# =====================================
# Movement Settings
# =====================================

movement:
  enabled: true

  # Maximum distance from the citizen spawn location
  radius: 300

  # Movement speed per update
  speed: 0.25

  # Movement update interval in ticks
  update-interval: 2

  # Time between choosing a new destination
  destination-selection-interval: 20

  # Maximum attempts to find a safe destination
  destination-attempts: 40

# =====================================
# Messages Settings
# =====================================

messages:
  enabled: true

  prefix: "&8[&aAICitizens&8] "

  mode: CHAT

  range: 30

  cooldown: 30

  on-arrival:
    enabled: true

    lines:
      - "&7A citizen has arrived."
      - "&7Someone is exploring the city."
      - "&7A citizen is walking around."
