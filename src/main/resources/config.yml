# AICitizens Configuration
citizens:
  max-count: 50
  tab-list:
    name-format: "&f{name}"
  spawn:
    enabled: true
  appearance:
    type: VILLAGER
    invulnerable: true
    collidable: false
    persistent: true
    ai-enabled: false
    custom-name-visible: false

# Citizens remain still until a recorded route is saved.
movement:
  enabled: false
  speed: 0.22
  update-interval: 2
  # Same recorded playback speed is used in both directions.
  forward-speed: 1.0

messages:
  enabled: true
  prefix: "&8[&aAICitizens&8] "
  mode: NEARBY
  range: 30
  cooldown: 30
  on-arrival:
    enabled: true
    lines:
      - "&7A citizen has arrived."
      - "&7Someone is exploring the city."
      - "&7A citizen is walking around."

protection:
  damage: true
  interaction: true
  fire: true
  targeting: true
  item-pickup: true
  knockback: true
  pushing: true
